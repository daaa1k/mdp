name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Export Go cache paths
        shell: bash
        run: |
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GOMODCACHE }}
            ${{ env.GOCACHE }}
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Format Check / Lint / Test
        run: mise run ci

      - name: Install E2E deps (Linux Wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb weston wl-clipboard xwayland

      - name: E2E Test (Linux Wayland)
        if: runner.os == 'Linux'
        run: mise run e2e-ci-linux-wayland

      - name: E2E Test (macOS)
        if: runner.os == 'macOS'
        run: |
          mise run e2e-macos-clipboard-webp
          mise run e2e-macos-clipboard-filedrop

      - name: E2E Test (Windows)
        if: runner.os == 'Windows'
        run: mise run e2e-ci-windows

  # Skip Nix until nix-vendor-hash.yml commits flake.nix (same PR may run CI in parallel first).
  nix-skip-gate:
    name: Nix skip gate (Renovate vendor hash)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      skip_nix: ${{ steps.check.outputs.skip_nix }}
    steps:
      - name: Check out source code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether to skip Nix flake check
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "skip_nix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${GITHUB_HEAD_REF}" != renovate/* ]]; then
            echo "skip_nix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"); then
            echo "skip_nix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          has_gomod=false
          has_flake=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            [[ "$f" == go.mod || "$f" == go.sum ]] && has_gomod=true
            [[ "$f" == flake.nix ]] && has_flake=true
          done <<< "$files"
          if [[ "$has_gomod" == true && "$has_flake" == false ]]; then
            echo "skip_nix=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_nix=false" >> "$GITHUB_OUTPUT"
          fi

  nix:
    name: Nix flake check (${{ matrix.os }})
    needs: nix-skip-gate
    if: needs.nix-skip-gate.outputs.skip_nix != 'true'
    runs-on: ${{ matrix.os }}
    environment: ci
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Set up Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: daaa1k
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '-source$'

      - name: Flake check
        run: nix flake check
